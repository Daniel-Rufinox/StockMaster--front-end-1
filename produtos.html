<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockMaster — Produtos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="conteudo">
    <div class="pagina">
      <h1>Produtos</h1>

      <div id="mensagem"></div>

      <div class="busca">
        <input type="text" id="campo-busca" placeholder="Buscar produto...">
        <a class="btn btn-primario" href="produto-novo.html">+ Cadastrar Produto</a>
      </div>

      <div class="cartao">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Produto</th>
              <th>Categoria</th>
              <th>Estoque</th>
              <th>Preço</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-produtos"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    montarLayout();

    function listar(filtro) {
      var dados = DB.ler();
      var termo = (filtro || '').toLowerCase();
      var html = '';
      for (var i = 0; i < dados.produtos.length; i++) {
        var p = dados.produtos[i];
        if (termo && p.nome.toLowerCase().indexOf(termo) === -1 && p.codigo.indexOf(termo) === -1) continue;
        var aviso = Number(p.quantidade) <= Number(p.minimo) ? ' class="alerta-texto"' : '';
        html += '<tr>' +
          '<td>' + p.codigo + '</td>' +
          '<td>' + p.nome + '</td>' +
          '<td>' + p.categoria + '</td>' +
          '<td' + aviso + '>' + p.quantidade + '</td>' +
          '<td>' + moeda(p.preco) + '</td>' +
          '<td><button class="btn btn-perigo btn-pequeno" onclick="excluir(' + p.id + ')">Excluir</button></td>' +
          '</tr>';
      }
      document.getElementById('tabela-produtos').innerHTML =
        html || '<tr><td colspan="6" class="vazio">Nenhum produto encontrado.</td></tr>';
    }

    function excluir(id) {
      if (!confirm('Deseja realmente excluir este produto?')) return;
      var dados = DB.ler();
      dados.produtos = dados.produtos.filter(function (p) { return p.id !== id; });
      dados.movimentacoes = dados.movimentacoes.filter(function (m) { return m.produtoId !== id; });
      DB.salvar(dados);
      mensagem('Produto excluído com sucesso.', 'ok');
      listar(document.getElementById('campo-busca').value);
    }

    document.getElementById('campo-busca').oninput = function () { listar(this.value); };
    listar('');
  </script>
</body>
</html>
