<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockMaster — Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-tela">
    <div class="login-caixa">
      <h1>StockMaster</h1>
      <p class="subtitulo">Sistema de Controle de Estoque Comercial</p>

      <div id="mensagem"></div>

      <form id="form-login">
        <div class="campo">
          <label for="usuario">Usuário</label>
          <input type="text" id="usuario" placeholder="Usuário" required>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Senha" required>
        </div>
        <button type="submit" class="btn btn-primario btn-bloco">Entrar</button>
      </form>

      <p class="rodape">Acesso de teste: admin / 123456</p>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    DB.ler();
    document.getElementById('form-login').onsubmit = function (e) {
      e.preventDefault();
      var usuario = document.getElementById('usuario').value.trim();
      var senha = document.getElementById('senha').value;
      if (Auth.entrar(usuario, senha)) {
        window.location.href = 'dashboard.html';
      } else {
        mensagem('Usuário ou senha inválidos.', 'erro');
      }
    };
  </script>
</body>
</html>
